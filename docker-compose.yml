services:
  # Base de données principale (utilisée par l'application)
  db:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: bank
      MYSQL_USER: bank
      MYSQL_PASSWORD: bank
      TZ: UTC
    command: ["--default-time-zone=+00:00"]
    ports:
      - "3306:3306"
    volumes:
      - ./db/init:/docker-entrypoint-initdb.d:ro
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-ubank", "-pbank"]
      interval: 5s
      timeout: 5s
      retries: 30

  api:
    build: ./api
    environment:
      PORT: 3000
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: bank
      DB_PASSWORD: bank
      DB_NAME: bank
      JWT_SECRET: change-me-in-production
      CORS_ORIGIN: http://localhost:8080
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy

  web:
    build: ./web
    ports:
      - "8080:80"
    depends_on:
      - api

  # Base de données jetable pour les tests d'intégration.
  # Données en mémoire (tmpfs) : repart du jeu de données initial à chaque redémarrage.
  # Lancer : docker compose --profile test up -d db-test
  db-test:
    image: mysql:8.4
    profiles: ["test"]
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: bank
      MYSQL_USER: bank
      MYSQL_PASSWORD: bank
      TZ: UTC
    command: ["--default-time-zone=+00:00"]
    ports:
      - "3307:3306"
    volumes:
      - ./db/init:/docker-entrypoint-initdb.d:ro
    tmpfs:
      - /var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-ubank", "-pbank"]
      interval: 5s
      timeout: 5s
      retries: 30

volumes:
  db-data:
